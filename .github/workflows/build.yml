name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KhaledAhmed-App.zip'
      - 'google-services.json'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q KhaledAhmed-App.zip -d build
          ls build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Inject settings
        working-directory: build/ka-app
        env:
          WEB_CLIENT_ID: ${{ vars.WEB_CLIENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sed -i "s|__WEB_CLIENT_ID__|${WEB_CLIENT_ID}|g;s|__SITE_URL__|${SITE_URL}|g" www/app.js
          mkdir -p android-config
          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then cp "$GITHUB_WORKSPACE/google-services.json" android-config/google-services.json; fi
      - name: Install dependencies
        working-directory: build/ka-app
        run: npm install --no-audit --no-fund
      - name: Prepare fonts
        working-directory: build/ka-app
        run: bash scripts/prepare.sh
      - name: Create Android project
        working-directory: build/ka-app
        run: |
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
      - name: Build APK
        working-directory: build/ka-app
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: cp build/ka-app/android/app/build/outputs/apk/debug/app-debug.apk KhaledAhmed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KhaledAhmed-APK
          path: KhaledAhmed.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: KhaledAhmed.apk


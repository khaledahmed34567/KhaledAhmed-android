name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KhaledAhmed-App.zip'
      - 'google-services.json'
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Find and unzip project
        shell: bash
        run: |
          Z=$(find . -maxdepth 3 -iname 'KhaledAhmed-App*.zip' | head -1)
          if [ -z "$Z" ]; then
            echo "::error::لم أجد ملف KhaledAhmed-App.zip في المستودع. ارفعه في الجذر بنفس الاسم."
            ls -la
            exit 1
          fi
          echo "zip: $Z"
          mkdir -p build
          unzip -q "$Z" -d build
          D=$(find build -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$D" ]; then
            echo "::error::الملف المضغوط لا يحتوي على package.json"
            find build | head -50
            exit 1
          fi
          mv "$(dirname "$D")" app
          ls -la app
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Inject settings
        working-directory: app
        shell: bash
        env:
          WEB_CLIENT_ID: ${{ vars.WEB_CLIENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 - <<'PY'
          import os
          p='www/app.js'
          s=open(p,encoding='utf-8').read()
          s=s.replace('__WEB_CLIENT_ID__',os.environ.get('WEB_CLIENT_ID','').strip())
          s=s.replace('__SITE_URL__',os.environ.get('SITE_URL','').strip())
          open(p,'w',encoding='utf-8').write(s)
          print('settings injected')
          PY
          mkdir -p android-config
          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" android-config/google-services.json
            echo "google-services.json found"
          else
            echo "google-services.json NOT found (الإشعارات لن تعمل)"
          fi
      - name: Install dependencies
        working-directory: app
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Prepare fonts
        working-directory: app
        shell: bash
        run: bash scripts/prepare.sh
      - name: Create Android project
        working-directory: app
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
      - name: Build APK
        working-directory: app
        shell: bash
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
      - name: Collect APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk KhaledAhmed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KhaledAhmed-APK
          path: KhaledAhmed.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: KhaledAhmed.apk
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          echo "---- ملخص الأخطاء ----"
          if [ -f gradle.log ]; then grep -n -E "error:|FAILED|What went wrong|No matching client|Execution failed" -A6 gradle.log | head -120 || true; fi
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore


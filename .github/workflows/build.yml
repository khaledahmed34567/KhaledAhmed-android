name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KhaledAhmed-App.zip'
      - 'google-services.json'
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Find and unzip project
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          echo "== files in repo =="; ls -la
          mapfile -d '' ZIPS < <(find . -maxdepth 3 -iname 'KhaledAhmed-App*.zip' -print0)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::لم أجد ملف KhaledAhmed-App.zip في المستودع. ارفعه في الجذر بنفس الاسم."
            exit 1
          fi
          BEST=""; BESTV=-1
          for Z in "${ZIPS[@]}"; do
            rm -rf _t; mkdir _t
            unzip -q "$Z" -d _t || continue
            VF=$(find _t -maxdepth 3 -name VERSION | head -1)
            V=0; if [ -n "$VF" ]; then V=$(tr -dc '0-9' < "$VF"); fi
            V=${V:-0}
            echo "zip: $Z -> version $V"
            if [ "$V" -gt "$BESTV" ]; then BESTV=$V; BEST="$Z"; fi
          done
          rm -rf _t
          echo "USING: $BEST (version $BESTV)"
          echo "الحزمة المستخدمة: $BEST (إصدار $BESTV)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p build
          unzip -q "$BEST" -d build
          D=$(find build -maxdepth 3 -name capacitor.config.json | head -1)
          if [ -z "$D" ]; then
            echo "::error::الملف المضغوط لا يحتوي على مشروع التطبيق (capacitor.config.json)"
            find build | head -50
            exit 1
          fi
          mv "$(dirname "$D")" app
          ls -la app
          ls -la app/www

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check tools
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          node -v; npm -v; java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Inject settings
        working-directory: app
        env:
          WEB_CLIENT_ID: ${{ vars.WEB_CLIENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          GH_REPO: ${{ github.repository }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          mkdir -p android-config
          if [ -f "$GITHUB_WORKSPACE/google-services.json" ]; then
            cp "$GITHUB_WORKSPACE/google-services.json" android-config/google-services.json
            echo "google-services.json found"
          else
            echo "google-services.json NOT found"
          fi
          python3 - <<'PY'
          import os,json
          p='www/app.js'
          s=open(p,encoding='utf-8').read()
          cid=os.environ.get('WEB_CLIENT_ID','').strip()
          gj='android-config/google-services.json'
          if not cid and os.path.exists(gj):
              try:
                  d=json.load(open(gj,encoding='utf-8'))
                  for c in d.get('client',[]):
                      for o in c.get('oauth_client',[]):
                          if o.get('client_type')==3 and not cid:
                              cid=o.get('client_id','')
              except Exception as e:
                  print('google-services parse error:',e)
          print('web client id:', 'found' if cid else 'not set (will use default_web_client_id)')
          s=s.replace('__WEB_CLIENT_ID__',cid)
          s=s.replace('__SITE_URL__',os.environ.get('SITE_URL','').strip())
          s=s.replace('__GH_REPO__',os.environ.get('GH_REPO','').strip())
          s=s.replace('__BUILD__',os.environ.get('BUILD_NO','').strip())
          pk=open('VERSION').read().strip() if os.path.exists('VERSION') else ''
          s=s.replace('__PKG__',pk)
          open(p,'w',encoding='utf-8').write(s)
          print('settings injected')
          PY

      - name: Install dependencies
        working-directory: app
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          npm install --no-audit --no-fund

      - name: Prepare fonts
        working-directory: app
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          bash scripts/prepare.sh

      - name: Create Android project
        working-directory: app
        env:
          BUILD_NO: ${{ github.run_number }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          rm -rf android
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android

      - name: Build APK
        working-directory: app
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/all.log") 2>&1
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk KhaledAhmed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KhaledAhmed-APK
          path: KhaledAhmed.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: KhaledAhmed.apk

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## سبب فشل البناء (آخر الأسطر)"
            echo '```'
            if [ -f all.log ]; then tail -n 60 all.log; else echo "فشل قبل تشغيل السكربتات. افتح الخطوة الحمراء."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f all.log ]; then
            MSG=$(tail -n 12 all.log | tr '\n' ' ' | cut -c1-700)
            echo "::error title=Build failed::$MSG"
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: all.log
          if-no-files-found: ignore
